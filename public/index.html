<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#DC2626"><meta name="description" content="Practice for exams with mock tests based on your course materials and lecturer's past questions."><link rel="manifest" href="/app.webmanifest"><link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><script>try{const t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch{}</script><title>Exam Focus</title>
<style>
:root{color-scheme:light;--r:#DC2626;--r2:#B91C1C;--bd:#E4E4E7;--m:#71717A;--f:#18181B;--bg:#FAFAFA;--s:#F4F4F5;--card:#fff;--field:#fff;--selected:#FEF2F2;--chip:#FEE2E2;--chip-text:#B91C1C;--highlight:#FEF2F2;--highlight-mid:#FEF9C3;--logo-bg:#FFF7F7}
:root[data-theme="dark"]{color-scheme:dark;--bd:#3F3F46;--m:#A1A1AA;--f:#FAFAFA;--bg:#18181B;--s:#27272A;--card:#27272A;--field:#18181B;--selected:#3B2022;--chip:#3B2022;--chip-text:#FCA5A5;--highlight:#54272A;--highlight-mid:#51451E;--logo-bg:#3B2022}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bd:#3F3F46;--m:#A1A1AA;--f:#FAFAFA;--bg:#18181B;--s:#27272A;--card:#27272A;--field:#18181B;--selected:#3B2022;--chip:#3B2022;--chip-text:#FCA5A5;--highlight:#54272A;--highlight-mid:#51451E;--logo-bg:#3B2022}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--f)}
nav{background:var(--card);border-bottom:1px solid var(--bd);min-height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px max(16px,calc((100% - 1160px)/2));gap:16px;flex-wrap:wrap}
.logo{display:flex;gap:12px;align-items:center;font-weight:600;white-space:nowrap;text-decoration:none;color:inherit}
.lg{width:32px;height:32px;border:1px solid var(--bd);border-radius:10px;display:grid;place-items:center;background:var(--logo-bg)}
.lg i{width:16px;height:16px;border-radius:50%;display:block;background:radial-gradient(#DC2626 28%,var(--logo-bg) 30% 52%,#DC2626 54% 74%,var(--logo-bg) 76%)}
.tabs{display:flex;gap:4px}.tabs a{padding:10px 16px;border-radius:10px;color:var(--m);text-decoration:none;white-space:nowrap}.tabs a.on{background:var(--s);color:var(--f)}
.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 14px inherit;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-block;text-align:center}
.btn:hover{background:var(--r2)}.btn:disabled{opacity:.5}.btn.o{background:var(--card);color:var(--f);border:1px solid var(--bd);font-weight:500}.btn.o:hover{background:var(--s)}.btn.w{width:100%}
main{max-width:1040px;margin:0 auto;padding:32px 16px 64px}
.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);font-weight:600}
h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:12px 0 8px;max-width:480px;text-wrap:balance}h2{font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:12px 0 4px}
.m{color:var(--m)}.sm{font-size:12px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px}
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}.g3{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.g2,.g3{grid-template-columns:1fr!important}h1{font-size:32px}.tabs a{padding:8px 10px}nav>.btn{display:none}.bar{grid-template-columns:100px 1fr 36px}.sel label{min-width:0;flex:1}}
select,input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--field);color:var(--f);width:100%}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}.sel{display:flex;gap:12px}.sel label{font-size:12px;min-width:140px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:5px 12px;white-space:nowrap}.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--r)}
.row{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--bd);text-decoration:none;color:inherit}
.bar{display:grid;grid-template-columns:140px 1fr 40px;gap:12px;align-items:center;margin:10px 0;font-size:12px}.tr{height:6px;background:var(--s);border-radius:9px;overflow:hidden}.tr b{display:block;height:100%;background:var(--r);border-radius:9px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s);font-size:12px;margin:2px;white-space:nowrap}.chip.r{background:var(--chip);color:var(--chip-text)}
.dc{border:1px solid var(--bd);border-radius:12px;padding:20px;cursor:pointer;background:var(--card)}.dc.on{border-color:var(--r);box-shadow:0 0 0 1px var(--r)}
.q{display:block;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}.q.on{border-color:var(--r);background:var(--selected)}
.read-high{background:var(--highlight);border-radius:4px;padding:1px 2px}.read-medium{background:var(--highlight-mid);border-radius:4px;padding:1px 2px}.reader-text{font-size:16px;line-height:1.9;white-space:normal}.reader-text span{margin-right:.25em}.study-nav{display:grid;gap:8px;align-content:start}.study-topic{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.study-topic.on{border-color:var(--r);background:var(--selected)}.study-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media(max-width:800px){.study-layout{grid-template-columns:1fr}}
.nv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.nv button{aspect-ratio:1;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--f);cursor:pointer;font:inherit}
.nv .d{background:#52525B;color:#fff}.nv .fl{border-color:var(--r);color:var(--r)}.nv .cur{background:var(--r);color:#fff;border-color:var(--r)}
details{border-top:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px}
button,a,select,input,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #FCA5A5;outline-offset:2px}
@media(max-width:800px){
 body{padding-bottom:env(safe-area-inset-bottom)}
 nav{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:8px 12px max(8px,env(safe-area-inset-top));}
 nav .logo{grid-column:1;grid-row:1}
 nav>.tabs{grid-column:1/-1;grid-row:2;display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;white-space:nowrap;margin:0 -4px}
 nav>.tabs::-webkit-scrollbar{display:none}
 .tabs a{flex:0 0 auto;padding:9px 12px;min-height:42px}
 nav>div:last-child{grid-column:2;grid-row:1;gap:6px!important}
 nav>div:last-child .btn{padding:9px 11px;font-size:13px}
 nav>div:last-child .btn:first-child{display:none}
 #who{display:none}
 main{width:100%;padding:22px 14px calc(32px + env(safe-area-inset-bottom))}
 h1{font-size:clamp(28px,8vw,34px);line-height:1.08;overflow-wrap:anywhere}
 h2{font-size:20px}
 .hd{align-items:stretch;gap:12px;margin-bottom:18px}
 .sel{width:100%;flex-wrap:wrap}
 .sel label{min-width:min(100%,160px);flex:1}
 .c{padding:20px}
 .g2,.g3{gap:12px;margin-bottom:12px}
 .bar{grid-template-columns:minmax(76px,30%) minmax(40px,1fr) 36px;gap:8px}
 .study-layout{gap:12px}
 .study-nav{display:flex;overflow-x:auto;gap:8px;padding:2px 0 8px;overscroll-behavior-x:contain}
 .study-topic{flex:0 0 min(78vw,240px)}
 .reader-text{font-size:17px;line-height:1.85}
 .nv{grid-template-columns:repeat(5,minmax(0,1fr))}
 .nv button{min-width:40px;min-height:40px;aspect-ratio:auto}
 .row{gap:10px;align-items:flex-start}
 .row>.btn,.row button{flex:0 0 auto}
 input,select,textarea{font-size:16px}
 .btn{min-height:44px}
 details summary{align-items:flex-start}
}
@media(max-width:420px){
 nav .logo{gap:8px}
 .lg{width:28px;height:28px}
 nav>div:last-child .btn{padding:8px 10px}
 main{padding-left:12px;padding-right:12px}
 .c{padding:16px}
 .g2,.g3{grid-template-columns:minmax(0,1fr)!important}
 .sel{display:grid;grid-template-columns:1fr}
 .bar{grid-template-columns:minmax(64px,28%) minmax(36px,1fr) 34px;font-size:11px}
 .nv{gap:5px}
}
:root[data-theme="dark"] [style*="background:#fff"],:root[data-theme="dark"] [style*="background: #fff"]{background:var(--card)!important}
@media(prefers-color-scheme:dark){:root:not([data-theme]) [style*="background:#fff"],:root:not([data-theme]) [style*="background: #fff"]{background:var(--card)!important}}
svg circle:first-child{stroke:var(--bd)}
svg text:last-of-type{fill:var(--m)}
</style></head><body>
<nav hidden><a class="logo" href="#/"><span class="lg"><i></i></span>Exam Focus</a>
<div class="tabs"><a data-p="d" href="#/">Dashboard</a><a data-p="study" href="#/study">Study</a><a data-p="generate" href="#/generate">Generate</a><a data-p="sources" href="#/sources">Sources</a><a data-p="courses" href="#/courses">Courses</a><a data-p="results" href="#/results">Results</a></div>
<div style="display:flex;align-items:center;gap:12px"><a class="btn" href="#/generate">+ Generate exam</a><span id="who" class="m sm"></span><button class="btn o" id="themeToggle" onclick="toggleTheme()"></button><button class="btn o" id="installApp" onclick="installApp()">Install</button><button class="btn o" onclick="signOut()">Sign out</button></div></nav>
<main id="app"></main>
<script>
const $=(s)=>document.querySelector(s),A=$("#app");
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{credentials:"same-origin",...o,headers:{...(o.headers||{})}});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j};
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const S={course:localStorage.course||"",lect:localStorage.lect||""},E={},R={};
function isDark(){return document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches)}
function syncTheme(){const dark=isDark(),label=dark?"Light mode":"Dark mode";document.querySelectorAll("#themeToggle").forEach(b=>{b.textContent=label;b.setAttribute("aria-label",`Switch to ${label.toLowerCase()}`);b.setAttribute("aria-pressed",String(dark))});const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?"#18181B":"#DC2626"}
function toggleTheme(){const theme=isDark()?"light":"dark";document.documentElement.dataset.theme=theme;localStorage.setItem("theme",theme);syncTheme()}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!localStorage.getItem("theme"))syncTheme()});
let installPrompt=null;
addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();installPrompt=ev;const b=$("#installApp");if(b)b.hidden=false});
addEventListener("appinstalled",()=>{installPrompt=null;const b=$("#installApp");if(b)b.hidden=true});
async function installApp(){if(installPrompt){await installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}
 alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?"To install Exam Focus, tap Share in Safari, then choose “Add to Home Screen”.":"To install Exam Focus, open your browser menu and choose “Install app” or “Add to Home screen”.")}
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(e=>console.warn("App offline setup failed:",e)));
function authScreen(mode,message=""){A.innerHTML=`<div class="c" style="max-width:440px;margin:9vh auto"><div style="display:flex;justify-content:space-between;align-items:center"><div class="k">Exam Focus account</div><button class="btn o" id="themeToggle" onclick="toggleTheme()"></button></div><h1 style="font-size:30px">${mode==="signup"?"Create your account":"Welcome back"}</h1><p class="m">${message?esc(message):"Sign in to keep your courses and study progress private."}</p><form id="authForm" style="display:grid;gap:12px;margin-top:20px">${mode==="signup"?`<label class="m">Your name<input name="name" autocomplete="name" required maxlength="80"></label>`:""}<label class="m">Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label class="m">Password<input name="password" type="password" autocomplete="${mode==="signup"?"new-password":"current-password"}" minlength="10" maxlength="128" required><span class="sm">At least 10 characters</span></label><button class="btn w" type="submit">${mode==="signup"?"Create account":"Sign in"}</button></form><button class="btn o w" style="margin-top:10px" onclick="authScreen('${mode==="signup"?"login":"signup"}')">${mode==="signup"?"Already have an account? Sign in":"New here? Create an account"}</button></div>`;syncTheme();
 $("#authForm").onsubmit=async ev=>{ev.preventDefault();const button=ev.currentTarget.querySelector("button[type=submit]"),values=Object.fromEntries(new FormData(ev.currentTarget));button.disabled=true;button.textContent="Please wait…";try{await post(`/auth/${mode}`,values);await enterApp()}catch(e){authScreen(mode,e.message)}};
}
async function enterApp(){const user=await api("/auth/me");$("#who").textContent=user.name;document.querySelector("nav").hidden=false;syncTheme();await go()}
async function signOut(){try{await post("/auth/logout",{});document.querySelector("nav").hidden=true;authScreen("login","You are signed out.")}catch(e){alert(e.message)}}
const L=(i)=>String.fromCharCode(65+i),dt=(d)=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const cn=()=>S.courses?.find(c=>c.id===S.course)?.title||"";
const ring=(v,l)=>`<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="37" fill="none" stroke="#E4E4E7" stroke-width="5"/><circle cx="42" cy="42" r="37" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round" stroke-dasharray="${2.325*v} 233" transform="rotate(-90 42 42)"/><text x="42" y="44" text-anchor="middle" font-size="22" font-weight="700">${v}</text><text x="42" y="58" text-anchor="middle" font-size="8" fill="#71717A" letter-spacing="1">${l}</text></svg>`;
const bars=(a)=>a.map(r=>`<div class="bar"><span>${esc(r.title)}</span><div class="tr"><b style="width:${r.pct}%"></b></div><span class="m">${r.pct}%</span></div>`).join("");
const arow=(r)=>`<a class="row" href="#/results/${r.id}"><div><div>${esc(cn())}</div><div class="m sm">${dt(r.submitted_at)} · ${esc(r.difficulty)} · ${r.n} questions</div></div><b style="font-size:18px;color:${r.pct<60?"#B91C1C":"inherit"}">${r.pct}%</b></a>`;
async function init(){if(!S.courses)[S.courses,S.lects]=await Promise.all([api("/courses"),api("/lecturers")]);if(!S.courses.find(c=>c.id===S.course))S.course=S.courses[0]?.id||""}
function pick(k,v){S[k]=v;localStorage[k]=v;go()}
const coursePicker=()=>`<label class="m">Course<select onchange="pick('course',this.value)">${S.courses.map(x=>`<option value="${x.id}" ${x.id===S.course?"selected":""}>${esc(x.code)} · ${esc(x.title)}</option>`).join("")}</select></label>`;
const noCourses=()=>{A.innerHTML=`<div class="c"><h2>Add your first course</h2><p class="m">Each course keeps its topics, sources, exams, and progress separate.</p><a class="btn" href="#/courses">Set up a course</a></div>`};
const usageCard=u=>`<div class="c sm" style="margin:16px 0;padding:16px 20px"><b>AI allowance today</b><div class="m">Your account: ${u.user.remaining} of ${u.user.limit} requests remaining · Shared service: ${u.platform.remaining} available · resets at 00:00 UTC. One exam may use several requests; cached work does not count.</div></div>`;

async function go(){const[,a,b]=(location.hash.slice(1)||"/").split("/");
 if(a!=="study"||STUDY.topicId!==b||STUDY.courseId!==S.course)await stopStudyTimer();
 document.querySelectorAll(".tabs a").forEach(x=>x.classList.toggle("on",x.dataset.p===(a||"d")));
 $("nav").hidden=a==="exam";
 try{await(R[a||"d"]||R.d)(b)}catch(e){A.innerHTML=`<p class="m">${esc(e.message)}</p>`}}
addEventListener("hashchange",go);

const STUDY={};
async function flushStudyTime(){if(STUDY.saving){await STUDY.saving;if(STUDY.seconds>=30)return flushStudyTime();return}if(!STUDY.chunkId||!STUDY.seconds)return;const chunkId=STUDY.chunkId,seconds=STUDY.seconds;STUDY.seconds=0;
 STUDY.saving=post("/reading/progress",{chunkId,seconds}).then(saved=>{if(saved.seconds>=30){const c=STUDY.detail?.chunks.find(x=>x.id===chunkId);if(c)c.read=true;if(STUDY.chunkId===chunkId){const status=$("#readerStatus");if(status)status.textContent="Read before"}}}).catch(e=>{if(STUDY.chunkId===chunkId)STUDY.seconds+=seconds;STUDY.error=e.message}).finally(()=>{STUDY.saving=null});
 await STUDY.saving;
}
function stopStudyTimer(){clearInterval(STUDY.timer);STUDY.timer=null;return flushStudyTime()}
function startStudyTimer(chunkId){if(STUDY.chunkId===chunkId&&STUDY.timer)return;clearInterval(STUDY.timer);STUDY.chunkId=chunkId;STUDY.seconds=0;STUDY.error="";STUDY.timer=setInterval(()=>{if(document.visibilityState!=="visible")return;STUDY.seconds++;if(STUDY.seconds>=30)flushStudyTime()},1000)}

R.d=async()=>{await init();
 if(!S.courses.length){A.innerHTML=`<p class="m">No courses yet. Add one to the courses table.</p>`;return}
 const q=`courseId=${S.course}&lecturerId=${S.lect}`,d=await api("/dashboard?"+q);
 const today=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).toUpperCase();
 A.innerHTML=`<div class="hd"><div><div class="k">${today}</div><h1>Make your next hour count.</h1><p class="m">A clear picture of what to practise next.</p></div>
 <div class="sel"><label class="m">Course<select onchange="pick('course',this.value)">${S.courses.map(x=>`<option value="${x.id}" ${x.id===S.course?"selected":""}>${esc(x.code)}</option>`).join("")}</select></label>
 <label class="m">Lecturer pattern<select onchange="pick('lect',this.value)"><option value="">Any lecturer</option>${S.lects.map(x=>`<option value="${x.id}" ${x.id===S.lect?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label></div></div>
 <div class="g2"><div class="c"><div style="display:flex;justify-content:space-between;gap:16px"><div><span class="pill k">Your study snapshot</span><h2 style="margin-top:20px">${esc(cn())}</h2><p class="m">Based on topic scores and how recently you practised.</p></div>${d.readiness==null?"":ring(d.readiness,"READINESS")}</div>
 <hr style="border:0;border-top:1px solid var(--bd);margin:24px 0 16px"><div style="display:flex;justify-content:space-between"><b>Topics tested most</b><span class="m sm">in past papers</span></div>
 ${d.topics.length?bars(d.topics):`<p class="m">Upload past questions to see which topics get tested.</p>`}<a class="btn w" style="margin-top:16px" href="#/generate">Start mock exam →</a></div>
 <div class="c" style="display:flex;flex-direction:column"><div class="k">Recent practice</div><h2>Keep your rhythm.</h2><div style="margin-top:12px">${d.recent.length?d.recent.map(arow).join(""):`<p class="m">No attempts yet.</p>`}</div><a href="#/results" class="m" style="text-decoration:none;margin-top:auto;padding-top:16px">View all attempts →</a></div></div>
 <div class="g3" style="grid-template-columns:repeat(3,1fr)"><div class="c" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px"><div><b>Your source library</b><div class="m sm">${d.sources} ready source${d.sources==1?"":"s"} · Past questions, notes and CCMAS</div></div><a class="btn o" href="#/sources">Manage →</a></div>
 <div class="c" style="padding:22px"><div class="k">Practice streak</div><b style="font-size:24px">${d.streak.current} day${d.streak.current===1?"":"s"}</b><div class="m sm">Longest: ${d.streak.longest} day${d.streak.longest===1?"":"s"} · exams or focused reading</div></div>
 <a class="c" href="#/${d.weak?"generate/weak":"sources"}" style="background:var(--s);text-decoration:none;color:inherit;padding:22px"><div class="k">Suggested next step</div><b>${d.weak?"Revisit "+esc(d.weak.toLowerCase()):"Upload a past paper"}</b><div class="m sm">${d.weak?"One of your lower-scoring topics.":"So Exam Focus can learn how your lecturer sets questions."}</div></a></div>`};

R.study=async(topicId)=>{await init();if(!S.courses.length){noCourses();return}
 const queue=await api("/reading?courseId="+S.course),chosen=queue.topics.find(t=>t.topic_id===topicId)||queue.topics[0];
 if(!chosen){A.innerHTML=`<div class="hd"><div><div class="k">${esc(cn())}</div><h1>Study your notes</h1><p class="m">Add course topics and upload lecture notes or a textbook to begin.</p></div>${coursePicker()}</div><div class="c"><p class="m">Reading guidance is based on your topics, past papers, and completed exams.</p><a class="btn" href="#/sources">Add study materials</a></div>`;STUDY.topicId="";return}
 const activeId=chosen.topic_id,detail=await api(`/reading/topics/${activeId}?courseId=${S.course}`);
 STUDY.topicId=activeId;STUDY.courseId=S.course;STUDY.detail=detail;STUDY.index=Math.min(STUDY.index||0,Math.max(0,detail.chunks.length-1));
 if(detail.chunks.length)startStudyTimer(detail.chunks[STUDY.index].id);else{clearInterval(STUDY.timer);STUDY.timer=null;STUDY.chunkId="";}
 drawStudy(queue.topics,detail,activeId)};
function drawStudy(queue,detail,activeId){const c=detail.chunks[STUDY.index],how=detail.howAsked;
 A.innerHTML=`<div class="hd"><div><div class="k">${esc(cn())} · Guided reading</div><h1>Study before you test.</h1><p class="m">Start with topics that recur in past papers and need practice. Highlights are based on your past questions.</p></div>${coursePicker()}</div>
 <div class="study-layout"><aside class="study-nav">${queue.map(t=>`<a class="study-topic ${t.topic_id===activeId?"on":""}" href="#/study/${t.topic_id}"><b>${esc(t.title)}</b><div class="m sm">${esc(t.reason)} · ${Math.round(t.readFraction*100)}% read</div></a>`).join("")}</aside>
 <section><div class="c" style="margin-bottom:16px"><div class="k">How this topic appears in your papers</div><h2 style="margin-top:8px">${esc(detail.topic.title)}</h2>
 ${how.askedInPapers?`<p class="m">Asked in ${how.askedInPapers}${how.ofPapers?` of ${how.ofPapers}`:""} papers${how.years.length?` · ${how.years.join(", ")}`:""}${how.typicalType?` · commonly ${esc(how.typicalType.replace("_"," "))}`:""}</p>`:`<p class="m">No past-paper questions are tagged to this topic yet.</p>`}
 ${how.verbs.length?`<div>${how.verbs.slice(0,5).map(v=>`<span class="chip">${esc(v.command_verb)} · ${v.n}</span>`).join("")}</div>`:""}
 ${how.guide?`<p><b>Answering tip:</b> ${esc(how.guide)}</p>`:""}</div>
 ${!c?`<div class="c"><p class="m">No reading passages are available for this topic yet. Upload notes, a textbook, or CCMAS material.</p><a class="btn o" href="#/sources">Manage sources</a></div>`:`<div class="c"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><b>Passage ${STUDY.index+1} of ${detail.chunks.length}</b><span class="m sm"><span id="readerStatus">${c.read?"Read before":"Reading now"}</span>${STUDY.error?` · Progress not saved: ${esc(STUDY.error)}`:""}</span></div>
 ${c.summary.length?`<div style="background:var(--s);border-radius:10px;padding:14px 18px;margin:16px 0"><b>Key points</b><ul>${c.summary.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
 <div class="reader-text" id="readerText" style="margin:18px 0">${c.sentences.map(s=>`<span class="${s.level==="high"?"read-high":s.level==="medium"?"read-medium":""}">${esc(s.text)}</span>`).join(" ")}</div>
 <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn o" onclick="moveStudy(-1)" ${STUDY.index===0?"disabled":""}>← Previous</button><button class="btn o" onclick="useStudySelection()">Use selected passage</button><button class="btn" onclick="moveStudy(1)" ${STUDY.index>=detail.chunks.length-1?"disabled":""}>Next →</button></div>
 <div style="border-top:1px solid var(--bd);margin-top:20px;padding-top:16px"><b>My note</b><input id="noteQuote" placeholder="Highlighted text (optional)" maxlength="2000" style="margin:8px 0"><textarea id="noteText" rows="3" maxlength="2000" placeholder="Write a note about this passage"></textarea><button class="btn o" style="margin-top:8px" onclick="saveStudyNote(this)">Save note</button></div>
 ${detail.notes.length?`<div style="margin-top:16px"><b>Saved notes for this topic</b>${detail.notes.map(n=>`<div class="row"><div>${n.quote?`<div><b>${esc(n.quote)}</b></div>`:""}<div class="m">${esc(n.note||"")}</div></div><button class="btn o" onclick="deleteStudyNote('${n.id}')">Delete</button></div>`).join("")}</div>`:""}</div>`}</section></div>`}
async function moveStudy(delta){await flushStudyTime();STUDY.index=Math.max(0,Math.min(STUDY.detail.chunks.length-1,STUDY.index+delta));const c=STUDY.detail.chunks[STUDY.index];if(c)startStudyTimer(c.id);drawStudy(await api("/reading?courseId="+S.course),STUDY.detail,STUDY.topicId)}
function useStudySelection(){const selected=document.getSelection()?.toString().trim();if(selected)$("#noteQuote").value=selected.slice(0,2000)}
async function saveStudyNote(b){const c=STUDY.detail.chunks[STUDY.index];if(!c)return;b.disabled=true;try{const n=await post("/reading/notes",{chunkId:c.id,quote:$("#noteQuote").value,note:$("#noteText").value});STUDY.detail.notes.unshift(n);drawStudy(await api("/reading?courseId="+S.course),STUDY.detail,STUDY.topicId)}catch(e){alert(e.message);b.disabled=false}}
async function deleteStudyNote(id){try{await api("/reading/notes/"+id,{method:"DELETE"});STUDY.detail.notes=STUDY.detail.notes.filter(n=>n.id!==id);drawStudy(await api("/reading?courseId="+S.course),STUDY.detail,STUDY.topicId)}catch(e){alert(e.message)}}

R.courses=async()=>{S.courses=null;await init();
 const tp=S.course?await api(`/courses/${S.course}/topics`):[];
 A.innerHTML=`<div class="k">Setup</div><h1>Courses</h1>
 <div class="g2" style="margin-top:24px"><div>
 <div class="c" style="margin-bottom:20px"><b>Add a course</b><div style="display:grid;gap:10px;margin:12px 0"><input id="cc" placeholder="Course code, e.g. PHS 208"><input id="ct" placeholder="Course title"><input id="cd" placeholder="Department (optional)"><input id="cl" type="number" placeholder="Level (optional)"></div><button class="btn w" onclick="addCourse(this)">Add course</button></div>
 <div class="c"><b>Add a lecturer</b><div style="display:grid;gap:10px;margin:12px 0"><input id="ln" placeholder="Lecturer name"></div><button class="btn w" onclick="addLect(this)">Add lecturer</button></div></div>
 <div class="c"><div class="k">Topics</div><select style="margin:8px 0" onchange="pick('course',this.value)">${S.courses.map(x=>`<option value="${x.id}" ${x.id===S.course?"selected":""}>${esc(x.code)} · ${esc(x.title)}</option>`).join("")}</select>
 ${tp.length?tp.map(t=>`<span class="chip">${esc(t.title)}</span>`).join(""):`<p class="m">No topics yet.</p>`}
 <hr style="border:0;border-top:1px solid var(--bd);margin:20px 0 14px"><b>Add topics from the CCMAS</b><p class="m sm">Paste the course content from the CCMAS, or upload that page as a PDF, then review the list before saving.</p>
 <textarea id="tx" rows="5" placeholder="Paste CCMAS course content here"></textarea><input id="tf" type="file" accept="application/pdf,image/*" style="margin-top:8px"><button class="btn o w" style="margin-top:8px" onclick="extractTopics(this)">Extract topics</button>
 <textarea id="tl" rows="8" placeholder="One topic per line. You can also type topics yourself." style="margin-top:12px"></textarea><button class="btn w" style="margin-top:8px" onclick="saveTopics(this)">Save topics</button></div></div>`};
async function addCourse(b){b.disabled=true;try{const r=await post("/courses",{code:$("#cc").value,title:$("#ct").value,department:$("#cd").value,level:$("#cl").value});S.course=r.id;localStorage.course=r.id;await R.courses()}catch(e){alert(e.message);b.disabled=false}}
async function addLect(b){b.disabled=true;try{await post("/lecturers",{name:$("#ln").value});await R.courses()}catch(e){alert(e.message);b.disabled=false}}
async function extractTopics(b){const fd=new FormData(),f=$("#tf").files[0];if(f)fd.append("file",f);else fd.append("text",$("#tx").value);
 b.disabled=true;b.textContent="Reading…";try{const r=await api(`/courses/${S.course}/topics/extract`,{method:"POST",body:fd});$("#tl").value=r.topics.join("\n")}catch(e){alert(e.message)}b.disabled=false;b.textContent="Extract topics"}
async function saveTopics(b){const topics=$("#tl").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!topics.length)return alert("Add at least one topic.");
 b.disabled=true;try{await post(`/courses/${S.course}/topics`,{topics});await R.courses()}catch(e){alert(e.message);b.disabled=false}}
R.sources=async()=>{await init();
 if(!S.courses.length){noCourses();return}
 const[p,src,usage]=await Promise.all([api(`/pattern?courseId=${S.course}&lecturerId=${S.lect}`),api("/sources?courseId="+S.course),api("/ai-usage")]);
 const tm=p?.profile?.typeMix||[],tot=tm.reduce((s,x)=>s+x.n,0)||1;
 A.innerHTML=`<div class="hd"><div><div class="k">${esc(cn())}</div><h1>Your source library</h1></div>${coursePicker()}</div>
 ${usageCard(usage)}
 <div class="g2" style="margin-top:24px"><div><div class="c" style="margin-bottom:20px"><b>Upload a PDF or photos</b><div class="m sm">Scanned papers and phone photos are read automatically. Select all pages together, named in order.</div><div style="display:grid;gap:10px;margin:12px 0"><select id="k"><option value="past_question">Past questions</option><option value="note">Notes</option><option value="textbook">Textbook</option><option value="ccmas">CCMAS</option></select><input id="y" type="number" placeholder="Exam year (past questions)"><input id="f" type="file" multiple accept="application/pdf,image/*"></div><button class="btn w" onclick="up(this)">Upload</button></div>
 <div class="c" style="padding:8px 28px">${src.length?src.map(x=>`<div class="row" style="border-top:0;border-bottom:1px solid var(--bd)"><div><div>${esc(x.name)}</div><div class="m sm">${esc(x.kind.replace("_"," "))}${x.year?" · "+x.year:""}${x.lecturer?" · "+esc(x.lecturer):""}${x.needs_ocr?" · scanned (read with OCR)":""}</div></div><span style="display:flex;gap:8px;align-items:center"><span class="chip ${x.status==="ready"?"":"r"}">${x.status}</span><button class="btn o" style="padding:4px 10px" onclick="delSrc('${x.id}')">Delete</button></span></div>`).join(""):`<p class="m" style="padding:16px 0">No sources yet.</p>`}</div></div>
 <div class="c"><div class="k">Lecturer pattern</div>${p?`<h2>${Math.round(p.confidence*100)}% confidence</h2><div class="tr"><b style="width:${p.confidence*100}%"></b></div><p class="m sm">${p.sample_size} paper${p.sample_size==1?"":"s"} analysed${p.confidence<.6?" · upload more past papers":""}</p><div>${tm.map(x=>`<span class="chip">${esc(x.q_type)} ${Math.round(100*x.n/tot)}%</span>`).join("")}</div><div style="margin-top:8px">${(p.profile.commonVerbs||[]).map(v=>`<span class="chip r">${esc(v.command_verb)}</span>`).join("")}</div>`:`<p class="m">Upload past questions to learn how this lecturer sets exams.</p>`}</div></div>`};
async function delSrc(id){if(!confirm("Delete this source and everything learned from it?"))return;try{await api("/sources/"+id,{method:"DELETE"});R.sources()}catch(e){alert(e.message)}}
async function up(b){const fs=[...$("#f").files];if(!fs.length)return alert("Choose a PDF or photo first.");
 const fd=new FormData();fd.append("courseId",S.course);fd.append("kind",$("#k").value);fd.append("lecturerId",S.lect);fd.append("year",$("#y").value);fs.forEach(f=>fd.append("file",f));
 b.disabled=true;b.textContent="Reading your file… scans can take a few minutes";
 try{await api("/documents",{method:"POST",body:fd});R.sources()}catch(e){alert(e.message);b.disabled=false;b.textContent="Upload"}}

R.generate=async(mode)=>{await init();if(!S.courses.length){noCourses();return}const usage=await api("/ai-usage");E.diff=E.diff||"medium";const weak=mode==="weak"?await api("/weak-topics?courseId="+S.course):[];E.focus=weak.length?weak.map(w=>w.id):null;
 A.innerHTML=`<div class="hd"><div><div class="k">New mock exam</div><h1>Generate exam</h1><p class="m">${esc(cn())}${S.lect?" · "+esc(S.lects.find(l=>l.id===S.lect)?.name||""):""}</p></div>${coursePicker()}</div>
 ${usageCard(usage)}
 ${mode==="weak"?`<div class="c" style="margin-top:20px;padding:18px"><b>Practising your weakest topics</b>${weak.length?`<div style="margin-top:8px">${weak.map(w=>`<span class="chip r">${esc(w.title)} · ${w.pct}%</span>`).join("")}</div>`:`<p class="m sm">Finish an exam first so we can find your weak topics. A normal exam will be generated instead.</p>`}</div>`:""}
 <div class="g3" style="grid-template-columns:repeat(3,1fr);margin-top:24px">${[["easy","Recall and definitions, single step."],["medium","Application, two to three steps."],["hard","Analysis, multi-part and calculations."]].map(([k,t])=>`<div class="dc ${E.diff===k?"on":""}" data-k="${k}" onclick="E.diff='${k}';document.querySelectorAll('.dc').forEach(x=>x.classList.toggle('on',x.dataset.k==='${k}'))"><b style="text-transform:capitalize">${k}</b><p class="m sm">${t}</p></div>`).join("")}</div>
 <div class="c" style="margin-top:20px;display:flex;gap:16px;align-items:end;flex-wrap:wrap"><label style="flex:1;min-width:140px" class="m">Questions<input id="n" type="number" value="${localStorage.lowCredit==="0"?10:5}" min="3" max="${localStorage.lowCredit==="0"?30:5}"></label>
 <label style="flex:2;min-width:220px;display:flex;align-items:center;gap:8px"><input id="low" type="checkbox" style="width:auto" ${localStorage.lowCredit==="0"?"":"checked"} onchange="lowCreditChanged(this)"><span>Low-credit mode <span class="m sm">(max 5; skips AI answer check)</span></span></label><button class="btn" id="gb" style="flex:2;min-width:200px" onclick="gen()" ${usage.user.remaining===0||usage.platform.remaining===0?"disabled":""}>${usage.user.remaining===0||usage.platform.remaining===0?"AI allowance reached":"Generate exam"}</button></div>`};
function lowCreditChanged(el){localStorage.lowCredit=el.checked?"1":"0";const n=$("#n");n.max=el.checked?"5":"30";if(+n.value>+n.max)n.value=n.max}
async function gen(){const b=$("#gb");b.disabled=true;b.textContent="Writing your exam…";const t0=Date.now(),iv=setInterval(()=>b.textContent="Writing your exam… "+Math.floor((Date.now()-t0)/1000)+"s",1000);
 try{const g=await post("/exams",{courseId:S.course,lecturerId:S.lect||null,difficulty:E.diff,count:+$("#n").value,focus:E.focus,lowCredit:$("#low").checked});
  E.warn=[Number(g.confidence)<.6&&"Low style confidence: upload more past papers.",g.lowCredit&&"Low-credit mode: limited to 5 questions; AI answer verification was skipped.",g.unverified&&!g.lowCredit&&`${g.unverified} answer(s) couldn't be verified.`].filter(Boolean).join(" ");
  location.hash="#/exam/"+g.examId}catch(e){alert(e.message);b.disabled=false;b.textContent="Generate exam"}finally{clearInterval(iv)}}

R.exam=async(id)=>{if(E.id!==id){const x=await api("/exams/"+id);E.qs=x.questions;E.dur=x.duration_minutes;Object.assign(E,{id,i:0,ans:{},fl:new Set(),spent:{},t0:Date.now(),qStartedAt:Date.now(),activeQ:null});clearInterval(E.iv);
  E.iv=setInterval(()=>{const t=$("#tm");if(!t)return;const s=Math.floor((Date.now()-E.t0)/1000),mm=(n)=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
   if(E.dur){const left=Math.max(E.dur*60-s,0);t.textContent=mm(left)+" left";if(left===0){clearInterval(E.iv);alert("Time is up. Submitting your answers.");fin(true)}}else t.textContent=mm(s)},1000)}drawExam()};
function drawExam(){if(E.qStartedAt&&E.activeQ)E.spent[E.activeQ]=(E.spent[E.activeQ]||0)+Date.now()-E.qStartedAt;const q=E.qs[E.i];E.activeQ=q?.id;E.qStartedAt=Date.now();const n=E.qs.length,done=E.qs.filter(x=>E.ans[x.id]).length;
 A.innerHTML=`<div style="position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><b>Exam Focus</b><span class="m" id="tm"></span><button class="btn" onclick="fin()">Submit</button></div><div class="tr" style="margin-top:12px"><b style="width:${100*done/n}%"></b></div></div>
 <div class="g2" style="grid-template-columns:2fr 1fr;margin-top:20px"><div class="c">${E.warn?`<p class="m sm">${esc(E.warn)}</p>`:""}<div class="k">${esc(q.section||"Question")} · Q${q.position} of ${n} · ${q.marks} marks</div><h2 style="font-size:18px;font-weight:500;line-height:1.5;margin:12px 0">${esc(q.text)}</h2>
 ${q.q_type==="mcq"&&Array.isArray(q.options)?q.options.map((o,i)=>`<label class="q ${E.ans[q.id]===L(i)?"on":""}"><input type="radio" hidden name="a" onchange="E.ans['${q.id}']='${L(i)}';drawExam()">${L(i)}. ${esc(String(o).replace(/^\(?[A-Da-d][).:]\s*/,""))}</label>`).join(""):`<textarea rows="8" oninput="E.ans['${q.id}']=this.value" placeholder="Your answer">${esc(E.ans[q.id]||"")}</textarea>`}
 <div style="display:flex;gap:8px;margin-top:16px"><button class="btn o" onclick="mv(-1)">Previous</button><button class="btn o" onclick="fl('${q.id}')">${E.fl.has(q.id)?"Unflag":"Flag"}</button><button class="btn" style="margin-left:auto" onclick="mv(1)">Next</button></div></div>
 <div class="c"><div class="k" style="margin-bottom:12px">Questions</div><div class="nv">${E.qs.map((x,i)=>`<button class="${i===E.i?"cur":E.fl.has(x.id)?"fl":E.ans[x.id]?"d":""}" onclick="E.i=${i};drawExam()">${i+1}</button>`).join("")}</div></div></div>`}
function mv(d){E.i=Math.max(0,Math.min(E.qs.length-1,E.i+d));drawExam()}
function fl(id){E.fl.has(id)?E.fl.delete(id):E.fl.add(id);drawExam()}
async function fin(force){const un=E.qs.filter(q=>!E.ans[q.id]).length;if(!force&&!confirm(`Submit now? ${un} unanswered, ${E.fl.size} flagged.`))return;
 if(E.qStartedAt&&E.activeQ){E.spent[E.activeQ]=(E.spent[E.activeQ]||0)+Date.now()-E.qStartedAt;E.qStartedAt=null}
 try{const r=await post(`/exams/${E.id}/submit`,{answers:E.qs.map(q=>({examQuestionId:q.id,response:E.ans[q.id]||"",timeSpent:Math.round((E.spent[q.id]||0)/1000)}))});clearInterval(E.iv);S.last=r;location.hash="#/results/"+r.attemptId}catch(e){alert(e.message)}}

R.results=async(id)=>{await init();
 if(!S.courses.length){noCourses();return}
 if(!id){const a=await api("/attempts?courseId="+S.course);A.innerHTML=`<div class="hd"><div><div class="k">History</div><h1>Results</h1></div>${coursePicker()}</div><div class="c" style="padding:8px 28px;margin-top:24px">${a.length?a.map(arow).join(""):`<p class="m" style="padding:16px 0">No attempts yet.</p>`}</div>`;return}
 const r=await api("/attempts/"+id);if(S.last?.attemptId===id)r.results.forEach(x=>{const live=S.last.results.find(y=>y.position===x.position);if(live)Object.assign(x,{feedback:live.feedback,errorType:live.errorType,markedBy:live.markedBy})});
 const pct=Math.round(100*r.score/Math.max(r.total,1)),tp={};r.results.forEach(x=>{if(x.topic){const t=tp[x.topic]??=[0,0];t[0]+=x.score;t[1]+=x.max}});
 A.innerHTML=`<a class="m" href="#/results" style="text-decoration:none">← All results</a>
 <div class="c" style="display:flex;gap:24px;align-items:center;margin:16px 0;flex-wrap:wrap">${ring(pct,"SCORE")}<div><h2 style="margin:0">${r.score} of ${r.total} marks</h2><div class="m">${esc(r.difficulty)} · ${esc(cn())}</div></div><span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><a class="btn o" href="#/generate/weak">Practice weak topics</a><a class="btn" href="#/generate">New exam</a></span></div>
 ${Object.keys(tp).length?`<div class="c" style="margin-bottom:16px"><b>Score by topic</b>${bars(Object.entries(tp).map(([title,[s,m]])=>({title,pct:Math.round(100*s/Math.max(m,1))})))}</div>`:""}
 <div class="c" style="padding:8px 28px">${r.results.map(x=>`<details><summary><b>Q${x.position}</b>${x.verified===false?`<span class="chip">not verified</span>`:""}<span style="color:${x.score>=x.max?"inherit":"#B91C1C"}">${x.score}/${x.max}</span></summary><p>${esc(x.question)}</p><p class="m">Your answer: ${esc(x.response||"—")}</p>${x.feedback?`<p>${esc(x.feedback)}</p>`:""}${x.markedBy?`<span class="chip">${esc(x.markedBy==="ai"?"AI marked":"Algorithm marked")}</span>`:""}${x.errorType?`<span class="chip">${esc(x.errorType.replace("_"," "))}</span>`:""}<p><b>Model answer:</b> ${esc(x.answer)}</p><p class="m">${esc(x.explanation)}</p></details>`).join("")}</div>`};
enterApp().catch(e=>authScreen("login",e.message)); // run only after every route (R.*) is defined
</script></body></html>
